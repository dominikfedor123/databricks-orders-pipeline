resources:
  jobs:
    master_pipeline_job:
      name: master_pipeline_job

      queue:
        enabled: true

      tasks:

        - task_key: run_orders_pipeline
          run_job_task:
            job_id: ${resources.jobs.orders_pipeline_job.id}

        - task_key: run_customers_pipeline
          run_job_task:
            job_id: ${resources.jobs.customers_pipeline_job.id}

        - task_key: run_customer_orders_export
          depends_on:
            - task_key: run_orders_pipeline
            - task_key: run_customers_pipeline
          run_job_task:
            job_id: ${resources.jobs.customer_orders_export_job.id}
