resources:
  jobs:
    orders_pipeline_job:
      name: orders_pipeline_job

      queue:
        enabled: true

      tasks:
        - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/00_LANDING_ORDERS.ipynb

        - task_key: bronze
          depends_on:
            - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/01_BRONZE_ORDERS.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_SILVER_ORDERS.ipynb

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_GOLD_ORDERS.ipynb