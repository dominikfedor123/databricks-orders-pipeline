resources:
  jobs:
    orders_pipeline_job:
      name: orders_pipeline_job

      queue:
        enabled: true

      tasks:
        - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/00_LANDING_ORDERS.ipynb

        - task_key: bronze
          depends_on:
            - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/01_BRONZE_ORDERS.ipynb

        - task_key: dbt_transformations
          depends_on:
            - task_key: bronze

          environment_key: dbt_env

          dbt_task:
            project_directory: ../orders_dbt
            commands:
              - "dbt build --select +fct_orders_incremental"
            warehouse_id: cfd3eec10376b45e
            catalog: workspace
            schema: dbt_dev

      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks==1.12.5"