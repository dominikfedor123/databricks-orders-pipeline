version: 2

models:
  - name: rejected_orders
    description: "Orders rejected by Silver Core data-quality rules."

    columns:
      - name: rejection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - INVALID_ORDER_ID
                  - INVALID_AMOUNT
                  - INVALID_CUSTOMER_ID
                  - INVALID_ORDER_DATE
                  - INVALID_CURRENCY
                  - DQ_FAILED

      - name: rejected_at
        data_tests:
          - not_null
