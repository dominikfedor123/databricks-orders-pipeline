version: 2

models:
  - name: gold_customers_scd2
    description: "SCD Type 2 customer history."

    columns:
      - name: customer_sk
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: valid_from
        data_tests:
          - not_null

      - name: is_current
        data_tests:
          - not_null

      - name: customer_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['STANDARD', 'PREMIUM', 'VIP', 'RETAIL', 'BUSINESS']
