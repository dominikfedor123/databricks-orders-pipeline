version: 2

models:
  - name: gold_customer_summary
    description: "Customer-level order summary derived from gold_orders."

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: total_orders
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null

      - name: completed_orders
        data_tests:
          - not_null

      - name: cancelled_orders
        data_tests:
          - not_null
