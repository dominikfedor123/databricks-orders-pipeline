version: 2

models:
  - name: export_orders_completed
    description: "Completed orders prepared for downstream export."

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED']
