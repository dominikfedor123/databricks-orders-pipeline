version: 2

models:
  - name: export_customer_orders
    description: "Order-level export enriched with current customer attributes."

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: currency
        data_tests:
          - not_null

      - name: customer_matched
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
